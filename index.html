['Germany','GER','#25272b',86,[0,1,2],[1,4,5,0],[0,0,1,3],['Jonas Kellermann','Felix Brandauer','Maximilian Vogt','Leon Hartwig','Niklas Roeder']],
['Spain','ESP','#d3202a',87,[0,1,2],[0,1,3],[0,3,0,1],['Iker Salvatierra','Hugo Bermejo','Pablo Navarrete','Adrian Calderon','Alvaro Montoya']],
['Portugal','POR','#7d1230',85,[1,2],[0,1,2],[0,1,0,3],['Diogo Albuquerque','Tiago Sequeira','Rui Cavalheiro','Goncalo Pestana','Rafael Almeida']],

['Japan','JPN','#17306b',82,[0,1],[2,0],[0,1,0],['Haruto Matsuoka','Kaito Moriyama','Sora Tanigawa','Yuto Hasegawa','Daichi Kuroda']]];

    p.name=d[0];p.spd=d[1];p.sht=d[2];p.pas=d[3];p.def=d[4];p.col=i<5?A.c:bc;p.k=cl(d[1]/75,.85,1.2);

}
function showSquad(){

function pickTeam(i){sel=i;do{opp=Math.floor(Math.random()*ROSTER.length)}while(opp===sel);applyTeams();showSquad()}
function home(p){var f=FORM[p.r];return{x:p.t?FW-f[0]*FW:f[0]*FW,y:f[1]*FH}}
function kickoff(t){
  for(var i=0;i<10;i++){var p=P[i],h=home(p);p.x=h.x;p.y=h.y;p.vx=p.vy=0;p.fx=p.t?-1:1;p.fy=0;p.cd=0;p.slide=0;p.press=0;p.mx=p.my=p.sm=0;p.a=p.t?Math.PI:0;p.ha=0;p.kt=0;p.st=0}
  var s=P[t*5+4];s.x=FW/2+(t?18:-18);s.y=FH/2;ball.x=FW/2;ball.y=FH/2;ball.vx=ball.vy=0;ball.own=s;ball.lt=t;ball.passer=null;ball.offs=null;G.rs=null;

}
function say(t,ms){var m=$('msg');m.textContent=t;m.classList.add('on');setTimeout(function(){m.classList.remove('on')},ms||1200)}
function hud(){var c=Math.max(0,Math.ceil(G.clock));$('tm').textContent=Math.floor(c/60)+':'+('0'+c%60).slice(-2);$('s0').textContent=G.score[0];$('s1').textContent=G.score[1]}
function kick(p,dx,dy,sp){var n=Math.hypot(dx,dy)||1;ball.own=null;ball.vx=dx/n*sp;ball.vy=dy/n*sp;ball.x=p.x+dx/n*(R+7);ball.y=p.y+dy/n*(R+7);p.cd=.4;p.fx=dx/n;p.fy=dy/n;p.kt=.3;p.kp=cl(sp/800,.25,1);p.kl=Math.random()<.8?1:-1;ball.lt=p.t;ball.passer=p;ball.offs=G.state==='play'?offsideSet(p):null;sfxKick(p.kp)}
function bestPass(p,dx,dy,ai){
  var b=null,bs=-1e9;
  for(var i=p.t*5;i<p.t*5+5;i++){var q=P[i];if(q===p)continue;
    var d=ds(p,q);if(d<60)continue;

    if(sc>bs){bs=sc;b=q}
  }

function doPass(p,ai){

  var q=bestPass(p,dx,dy,ai||p.t===1);

function moveTo(p,tx,ty,sp){
  var dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);

function control(p,dt){
  var m=Math.hypot(inp.x,inp.y),owner=ball.own===p;

    var sp=(inp.sprint?215:152)*(owner?.94:1)*p.k;

function ai(p,dt){

  var dx=bx-pbx,dz=bz-pbz,dl=Math.hypot(dx,dz);
  if(dl>1e-4&&dl<60){axis.set(dz,0,-dx).normalize();qSpin.setFromAxisAngle(axis,dl/BR);ballM.quaternion.premultiply(qSpin)}
  pbx=bx;pbz=bz;
  // selection marker + tag
  if(play){
    var px=cp.x-HX,pz=cp.y-HZ,pu=1+.05*Math.sin(TT*6);
    ring.visible=ring2.visible=arrow.visible=true;ring.position.x=ring2.position.x=px;ring.position.z=ring2.position.z=pz;ring.scale.set(pu,pu,1);
    arrow.position.set(px,56+Math.sin(TT*5)*2.5,pz);arrow.rotation.y=TT*2;
    vv.set(px,66,pz).project(camera);
    tagEl.style.display='flex';tagEl.style.transform='translate('+((vv.x*.5+.5)*cw)+'px,'+((-vv.y*.5+.5)*ch)+'px) translate(-50%,-100%)';
    if(tnEl.textContent!==cp.name)tnEl.textContent=cp.name;
    var chg=inp.charging&&ball.own===cp,pw=cl(.3+inp.shT*1.1,.3,1);
    tpEl.style.display=chg?'block':'none';if(chg){tfEl.style.width=(pw*100)+'%';tfEl.style.background=pw>.92?'#ff5a36':'#2f9bff'}
  }else{ring.visible=ring2.visible=arrow.visible=false;tagEl.style.display='none'}
  // crowd cheer
  var tc=Math.max(G.state==='goal'?(G.scorer===0?1:.6):0,CR.lvl*.8);
  crowd.cel+=(tc-crowd.cel)*Math.min(1,dt*4);if(crowd.cel>.02||crowd.on){crowdUpdate(crowd.cel);crowd.on=crowd.cel>.02}
  // HUD button labels
  var o2=ball.own===cp,bp=$('bp'),bs=$('bs'),a=o2?'PASS':'PRESS',b=o2?'SHOOT':'TACKLE';
  if(bp.textContent!==a)bp.textContent=a;if(bs.textContent!==b)bs.textContent=b;
  renderer.render(scene,camera);
}

applyTeams();showSquad();kickoff(0);hud();

// controls
var base=$('base'),knob=$('knob'),zone=$('zone'),sid=null,ox=0,oy=0,tdn=0;
zone.addEventListener('pointerdown',function(e){if(sid!==null)return;sid=e.pointerId;ox=e.clientX;oy=e.clientY;tdn=performance.now();base.style.left=ox+'px';base.style.top=oy+'px';base.style.display='block';knob.style.transform='';try{zone.setPointerCapture(sid)}catch(x){}});
zone.addEventListener('pointermove',function(e){if(e.pointerId!==sid)return;
  var dx=e.clientX-ox,dy=e.clientY-oy,l=Math.hypot(dx,dy),m=Math.min(l,55);
  if(l>0){inp.x=dx/l*(m/55);inp.y=dy/l*(m/55);knob.style.transform='translate('+(dx/l*m)+'px,'+(dy/l*m)+'px)'}});
function sEnd(e){if(e.pointerId!==sid)return;sid=null;inp.x=inp.y=0;base.style.display='none';
  if(e.type==='pointerup'&&performance.now()-tdn<250&&Math.hypot(e.clientX-ox,e.clientY-oy)<12)trySelect(e.clientX,e.clientY)}
zone.addEventListener('pointerup',sEnd);zone.addEventListener('pointercancel',sEnd);
function btn(id,dn,up){var el=$(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(x){}dn()});
  function u(){el.classList.remove('down');up()}
  el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)}
btn('bp',function(){inp.pass=true},function(){});
btn('bs',function(){inp.sh=true;inp.shNew=true},function(){inp.sh=false;inp.shRel=true});
btn('bq',function(){inp.sprint=true},function(){inp.sprint=false});
function trySelect(x,y){
  if(G.state!=='play')return;
  var b=-1,bd=60,v=new THREE.Vector3();
  for(var i=0;i<5;i++){v.set(P[i].x-FW/2,22,P[i].y-FH/2).project(camera);var sx=(v.x*.5+.5)*cw,sy=(-v.y*.5+.5)*ch,d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;b=i}}
  if(b>=0)G.ctl=b;
}
function switchNext(){
  var l=[1,2,3,4].sort(function(a,b){return ds(P[a],ball)-ds(P[b],ball)});
  G.ctl=(G.ctl===l[0])?l[1]:l[0];
}
cv.addEventListener('pointerdown',function(e){trySelect(e.clientX,e.clientY)});
btn('bw',function(){if(G.state==='play')switchNext()},function(){});
$('ba').addEventListener('click',function(){G.auto=!G.auto;this.textContent='Auto switch: '+(G.auto?'ON':'OFF')});
window.addEventListener('keydown',function(e){if(e.code==='KeyI'&&G.state==='play')switchNext()});
var keys={};
window.addEventListener('keydown',function(e){if(keys[e.code])return;keys[e.code]=1;
  if(e.code==='KeyJ')inp.pass=true;if(e.code==='KeyK'){inp.sh=true;inp.shNew=true}if(e.code==='KeyL')inp.sprint=true;kd()});
window.addEventListener('keyup',function(e){keys[e.code]=0;
  if(e.code==='KeyK'){inp.sh=false;inp.shRel=true}if(e.code==='KeyL')inp.sprint=false;kd()});
function kd(){if(sid!==null)return;inp.x=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);inp.y=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);var m=Math.hypot(inp.x,inp.y);if(m>1){inp.x/=m;inp.y/=m}}

var last=performance.now();dressAll();
function loop(now){var dt=Math.min((now-last)/1000,.033);last=now;update(dt);sysTick(dt);try{render(dt)}catch(e){if(!window.__re){window.__re=1;console.error(e)}}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
